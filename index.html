<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Word Family Showdown</title><style>
:root{--teal:#087f8c;--purple:#6d3ca6;--gold:#e5ac31;--ink:#243348;--pale:#eaf8fa}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#e9f8fa,#f4edff 65%,#fff8e6);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);min-height:100vh}.wrap{max-width:800px;margin:auto;padding:24px 16px 50px}header{text-align:center;margin:15px 0 20px}h1{color:var(--purple);font-size:clamp(2rem,5vw,3.2rem);margin:8px 0}header p{font-size:1.05rem;margin:4px}.pill{display:inline-block;background:#fff;border:2px solid #b9e6e9;border-radius:99px;padding:7px 16px;font-weight:700;color:var(--teal)}main{background:white;border:2px solid #d6e5ed;border-radius:22px;box-shadow:0 12px 35px #43366b18;padding:clamp(20px,4vw,34px)}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700;color:var(--purple)}.progress{height:11px;background:#e8e9f0;border-radius:12px;overflow:hidden;margin:16px 0 24px}.bar{height:100%;background:linear-gradient(90deg,var(--teal),var(--purple));transition:width .25s}h2{color:var(--teal);margin:0 0 10px;font-size:1.55rem}.prompt{font-size:1.08rem;line-height:1.55}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:22px 0}.choice{border:2px solid #c8d7e1;border-radius:13px;padding:17px 10px;background:#f9fcff;color:var(--ink);font:inherit;font-size:1.08rem;font-weight:700;cursor:pointer;min-height:64px}.choice:hover:not(:disabled),.choice:focus-visible{border-color:var(--purple);background:#f4effb}.choice.selected{border-color:var(--purple);background:#eee3ff}.choice.correct{border-color:#13835d;background:#e7f7ed}.choice.wrong{border-color:#b94b55;background:#ffeded}.choice:disabled{cursor:default}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button.primary{background:var(--purple);color:#fff;border:0;border-radius:12px;padding:13px 22px;font:inherit;font-weight:800;cursor:pointer}button.secondary{background:white;color:var(--purple);border:2px solid var(--purple);border-radius:12px;padding:11px 20px;font:inherit;font-weight:800;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.feedback{margin-top:16px;border-left:5px solid var(--teal);background:var(--pale);padding:14px 16px;border-radius:8px;line-height:1.5}.feedback strong{display:block;margin-bottom:5px}.inputrow{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.inputrow input{flex:1;min-width:190px;padding:13px;border:2px solid #9cb9c5;border-radius:10px;font:inherit}.hint{font-size:.94rem;color:#596777}.family{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.word{border-radius:99px;background:#f2eafd;color:var(--purple);font-weight:750;padding:9px 13px}.hidden{display:none}.final{text-align:center}.final .big{font-size:3.4rem;color:var(--purple);font-weight:900;margin:12px}.foot{text-align:center;color:#647184;font-size:.88rem;margin:16px} @media(max-width:470px){.choices{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><header><span class="pill">WORD STUDY • GRADE 5</span><h1>🏆 Word Family Showdown!</h1><p>Build it. Spot it. Explain it.</p></header><main id="game" aria-live="polite"></main><p class="foot">Think about both the shared base and the shared meaning. No account or personal information needed.</p></div><script>
const rounds=[
{type:'choice',title:'Round 1: Find the Imposter',prompt:'Which word does NOT belong in the <strong>predict</strong> family?',choices:['prediction','predictable','protect','predictor'],answer:2,why:'Predict, prediction, predictable, and predictor all relate to saying what may happen beforehand. Protect means to keep safe; it is not part of that word family.'},
{type:'choice',title:'Round 2: Find the Imposter',prompt:'Which word does NOT belong in the <strong>inspect</strong> family?',choices:['inspection','inspector','inspire','inspected'],answer:2,why:'Inspect, inspection, inspector, and inspected share the idea of looking at something carefully. Inspire does not share that base meaning.'},
{type:'choice',title:'Round 3: Find the Imposter',prompt:'Which word does NOT belong in the <strong>inform</strong> family?',choices:['informed','information','infirm','informative'],answer:2,why:'Inform, informed, information, and informative all relate to giving or having knowledge. Infirm means physically weak or ill.'},
{type:'choice',title:'Round 4: Find the Imposter',prompt:'Which word does NOT belong in the <strong>collect</strong> family?',choices:['collector','collection','collide','collecting'],answer:2,why:'Collect, collector, collection, and collecting relate to gathering things together. Collide means to crash into something.'},
{type:'choice',title:'Round 5: Defend Your Family',prompt:'How does <strong>inspection</strong> relate to <strong>inspect</strong>?',choices:['Inspection means a careful examination; inspect is the action of examining.','Inspection means someone who inspects.','The words are related only because they begin with the same letters.','Inspection means to inspire someone.'],answer:0,why:'Inspect is a verb meaning to examine carefully. Inspection is a noun naming the act or process of examining. The spelling and meaning connect.'},
{type:'choice',title:'Round 6: Build the Meaning',prompt:'Which word best completes the sentence? <em>The workers began the _____ of the new bridge.</em>',choices:['construct','construction','constructor','constructed'],answer:1,why:'Construction is a noun naming the process of building. The sentence needs a noun after “the.”'},
{type:'choice',title:'Round 7: Mystery Family',prompt:'Which pair belongs to the <strong>construct</strong> family?',choices:['construction and reconstruct','conductor and contact','contest and contrast','consider and conclude'],answer:0,why:'Construct, construction, and reconstruct all share the meaning of building. Reconstruct means to build again.'},
{type:'type',title:'Round 8: Build It!',prompt:'Type a word from the <strong>employ</strong> family that means <em>a person who works for someone</em>.',accepted:['employee'],display:'employee',why:'An employee is a person who works for an employer. Both words are part of the employ family.'},
{type:'type',title:'Round 9: Build It!',prompt:'Type a word from the <strong>observe</strong> family that means <em>the act of watching or noticing carefully</em>.',accepted:['observation'],display:'observation',why:'Observation names the act or result of observing. The base meaning stays connected even as the word changes.'},
{type:'choice',title:'Round 10: Final Challenge',prompt:'Which is the BEST way to decide whether two words belong to the same word family?',choices:['They have the same first letter.','They rhyme.','They share a base and a related meaning.','They have the same number of syllables.'],answer:2,why:'A true word-family relationship involves a shared base and a meaningful connection—not just similar letters or sounds.'}
];let index=0,score=0,locked=false;const root=document.getElementById('game');function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function start(){index=0;score=0;render()}function render(){locked=false;if(index>=rounds.length){root.innerHTML=`<section class="final"><h2>🎉 Showdown Complete!</h2><p class="big">${score} / ${rounds.length}</p><p>${score===10?'Word-family champion!':score>=8?'Excellent word-family detective work!':'Nice work! Review the explanations and try again.'}</p><p class="hint">Show this score to your teacher if requested. It is not automatically submitted to Google Classroom.</p><button class="primary" onclick="start()">Play Again</button></section>`;return}let r=rounds[index];root.innerHTML=`<div class="top"><span>Challenge ${index+1} of ${rounds.length}</span><span>⭐ Score: ${score}</span></div><div class="progress" aria-label="Progress"><div class="bar" style="width:${index/rounds.length*100}%"></div></div><h2>${r.title}</h2><p class="prompt">${r.prompt}</p>${r.type==='choice'?`<div class="choices">${r.choices.map((w,i)=>`<button class="choice" data-i="${i}" onclick="choose(${i})">${esc(w)}</button>`).join('')}</div>`:`<div class="inputrow"><input id="typed" aria-label="Your word" autocomplete="off" spellcheck="false" placeholder="Type your word here"><button class="primary" onclick="checkTyped()">Check Word</button></div><p class="hint">Spelling matters. Think about the meaning of the word.</p>`}<div id="feedback" aria-live="polite"></div><div class="controls"><button class="primary hidden" id="next" onclick="advance()">${index===rounds.length-1?'See My Score':'Next Challenge →'}</button></div>`;if(r.type==='type'){document.getElementById('typed').addEventListener('keydown',e=>{if(e.key==='Enter')checkTyped()})}}function feedback(ok,why,extra=''){if(locked)return;locked=true;if(ok)score++;document.getElementById('feedback').innerHTML=`<div class="feedback"><strong>${ok?'✅ Correct!':'💡 Good try—here’s the connection.'}</strong>${extra}${why}</div>`;document.getElementById('next').classList.remove('hidden')}function choose(i){if(locked)return;const r=rounds[index];document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===r.answer)b.classList.add('correct');if(j===i&&i!==r.answer)b.classList.add('wrong')});feedback(i===r.answer,r.why)}function checkTyped(){if(locked)return;let el=document.getElementById('typed');let value=el.value.trim().toLowerCase().replace(/[^a-z]/g,'');if(!value){el.focus();return}el.disabled=true;const r=rounds[index];const ok=r.accepted.includes(value);feedback(ok,r.why,ok?'':`<p>Expected word: <strong>${r.display}</strong>.</p>`)}function advance(){index++;render()}render();
</script></body></html>
